name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TRAFIKU_SERVER_BASE_URL: ${{ vars.TRAFIKU_SERVER_BASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD \
            TRAFIKU_SERVER_BASE_URL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required release value: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/trafiku-release.keystore"

      - name: Run tests, lint, and signed release build
        env:
          TRAFIKU_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/trafiku-release.keystore
          TRAFIKU_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TRAFIKU_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TRAFIKU_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TRAFIKU_SERVER_BASE_URL: ${{ vars.TRAFIKU_SERVER_BASE_URL }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          ./gradlew test lint assembleRelease \
            "-Ptrafiku.server.baseUrl=${TRAFIKU_SERVER_BASE_URL}" \
            "-Ptrafiku.versionCode=${GITHUB_RUN_NUMBER}" \
            "-Ptrafiku.versionName=${version_name}" \
            --stacktrace

      - name: Verify APK signature
        run: |
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner_path}" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "${apksigner_path}" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: trafiku-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
